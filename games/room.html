<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a; /* Темный фон, как в основном меню */
            color: #ffffff;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .room-container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }
        .room-image {
            width: 100%;
            max-width: 600px; /* Ограничиваем ширину */
            height: auto; /* Сохраняем пропорции */
            border-radius: 15px; /* Закругляем углы */
            margin: 20px 0; /* Отступы сверху и снизу */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); /* Тень */
            object-fit: cover; /* Обрезка изображения */
        }
        .room-text {
            font-size: 2rem; /* Размер текста */
            font-weight: 700; /* Жирность */
            margin: 20px 0; /* Отступы */
            color: #ffffff; /* Цвет текста */
        }
        .back-button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1); /* Прозрачный фон */
            backdrop-filter: blur(10px); /* Размытие фона */
            border: 1px solid rgba(255, 255, 255, 0.2); /* Обводка */
            border-radius: 25px; /* Закругление */
            color: white; /* Цвет текста */
            text-decoration: none; /* Убираем подчеркивание */
            font-weight: 500; /* Жирность */
            font-size: 0.9rem; /* Размер шрифта */
            transition: all 0.3s ease; /* Плавный переход */
            display: inline-block; /* Позволяет центрировать */
        }
        .back-button:hover {
            background: rgba(255, 255, 255, 0.2); /* При наведении */
            transform: translateY(-1px); /* Поднятие при наведении */
        }
        /* Стили для кликабельного текста */
        .clickable-text {
            color: #aaa; /* Серый цвет */
            text-decoration: underline; /* Подчеркивание */
            cursor: pointer; /* Курсор в виде руки */
            transition: color 0.3s ease; /* Плавный переход цвета */
        }
        .clickable-text:hover {
            color: #ffffff; /* Цвет при наведении */
        }
        /* === Стили для снега === */
.snowflakes-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Позволяет кликать сквозь снег */
    z-index: 1000; /* Высокий z-index, но ниже загрузочного экрана */
    overflow: hidden;
}
.snowflake {
    position: absolute;
    width: 10px;
    height: 10px;
    background-color: #fff;
    border-radius: 50%;
    opacity: 6;
    filter: blur(1px);
    /* Анимация снега по диагонали */
    animation: fallDiagonal 10s linear infinite;
}
/* Для кастомных снежинок (изображений) */
.snowflake.custom-snowflake {
    width: 20px; /* Базовый размер */
    height: 20px;
    /* Убираем все стили, связанные с фоном */
    background: none !important; /* Гарантируем отсутствие фона */
    border: none;
    padding: 0;
    margin: 0;
}
.snowflake.custom-snowflake img {
    width: 100%;
    height: 100%;
    display: block; /* Убираем возможные отступы */
    image-rendering: pixelated; /* Если нужно сохранить пиксельный стиль */
    /* Ключевая строка: гарантируем прозрачность */
    background: transparent !important;
    /* Дополнительно: если изображение всё равно показывает белый фон, можно попробовать это */
    mix-blend-mode: screen; /* Это может помочь, но иногда создает странные эффекты */
}
@keyframes fallDiagonal {
    0% {
        transform: translateY(-100vh) translateX(150vw);
        opacity: 2;
    }
    100% {
        transform: translateY(130vh) translateX(-250vw);
        opacity: 4;
    }
}
/* === Конец стилей снега === */
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="room-container">
        <!-- Подставь правильный путь к изображению -->
        <img src="https://i.pinimg.com/736x/43/b5/a9/43b5a96da1b7144ca19e148cb39006c2.jpg" alt="Фото комнаты" class="room-image">
        <div class="room-text">А вот и ты милашка!</div>
        <!-- Кликабельный текст -->
        <p class="section-info"> Правда ведь милашка, да??? Я долго искал фотографию так то! Целых минут 20 потратил, так что ценим! А так мы ведь знаем какая ты зайка и обояшка, поэтому что тут говорить.. я твой фанат так то!</p>
        <a href="../index.html" class="back-button">← Обратно? </a>
    </div>
        <!-- Контейнер для снега -->
    <div class="snowflakes-container" id="snowContainer"></div>
    <script>        // === Скрипт для снега и звука ===
        document.addEventListener('DOMContentLoaded', function () {
            // Ждем, пока загрузочный экран исчезнет (если есть) или просто проходит 3.5 секунды
            setTimeout(() => {
                const snowContainer = document.getElementById('snowContainer');
                const customImages = ['../images/34.png', '../images/35.png']; // Укажите пути к вашим PNG-изображениям
                // --- Создание снежинок ---
                // Обычные снежинки (круги)
                for (let i = 0; i < 50; i++) {
                    const snowflake = document.createElement('div');
                    snowflake.classList.add('snowflake');
                    snowContainer.appendChild(snowflake);
                    // Случайные параметры для анимации
                    const duration = 5 + Math.random() * 10; // 5-15 секунд
                    const delay = Math.random() * 5; // 0-5 секунд задержки
                    const size = 2 + Math.random() * 6; // 2-8 пикселей
                    const startX = 100 + Math.random() * 170; // Начинают немного правее экрана
                    const opacity = 0.5 + Math.random() * 0.5; // 0.5-1
                    snowflake.style.left = `${startX}vw`;
                    snowflake.style.width = `${size}px`;
                    snowflake.style.height = `${size}px`;
                    snowflake.style.animation = `fallDiagonal ${duration}s linear ${delay}s infinite`;
                    snowflake.style.opacity = opacity;
                }
                // Кастомные снежинки (изображения)
                for (let i = 0; i < 10; i++) {
                    const snowflake = document.createElement('div');
                    // Случайно выбираем изображение
                    const imgClass = Math.random() > 0.5 ? 'custom-34' : 'custom-35';
                    snowflake.classList.add('snowflake', 'custom-snowflake', imgClass);
                    snowContainer.appendChild(snowflake);
                    // Создаем элемент img
                    const img = document.createElement('img');
                    img.src = customImages[imgClass === 'custom-34' ? 0 : 1]; // Выбираем нужный URL
                    snowflake.appendChild(img);
                    // Случайные параметры для анимации и размера
                    const duration = 6 + Math.random() * 12; // 6-18 секунд
                    const delay = Math.random() * 5; // 0-5 секунд задержки
                    const size = 10 + Math.random() * 36; // 10-40 пикселей
                    const startX = 100 + Math.random() * 170; // Начинают немного правее экрана
                    const opacity = 0.6 + Math.random() * 0.4; // 0.6-1
                    snowflake.style.left = `${startX}vw`;
                    snowflake.style.width = `${size}px`;
                    snowflake.style.height = `${size}px`;
                    snowflake.style.animation = `fallDiagonal ${duration}s linear ${delay}s infinite`;
                    snowflake.style.opacity = opacity;
                }
                // --- Воспроизведение звука ---
                const audio = document.createElement('audio');
                audio.src = '../assets/music31.mp3'; // Укажите путь к вашему аудиофайлу
                audio.loop = true; // Зацикливаем воспроизведение
                audio.volume = 0.15; // Устанавливаем громкость (0.0 - 1.0)
                // Пытаемся воспроизвести звук (многие браузеры требуют взаимодействия пользователя)
                // Поэтому воспроизводим после задержки и игнорируем ошибки
                audio.play().catch(e => {
                    console.log("Автовоспроизведение звука заблокировано, будет воспроизводиться после взаимодействия пользователя.");
                    // Если автовоспроизведение не сработало, можно попробовать по клику
                    document.body.addEventListener('click', function playAudioOnInteraction() {
                        audio.play().catch(e => console.error("Ошибка воспроизведения аудио:", e));
                        document.body.removeEventListener('click', playAudioOnInteraction);
                    });
                });
            }, 100); // 3500 миллисекунд = 3.5 секунды
        });
    // === Конец скрипта снега и звука ===</script>
</body>
</html>
